{{ partial "header.html" . }}

<main id="main">

	<div class="container">

		<div class="row topspace">
			<div class="col-sm-8 col-sm-offset-2">

 				<article class="post">
					<header class="entry-header">
 						<div class="entry-meta">
 							<span class="posted-on"><time class="entry-date published" date="{{ .Date }}">{{ dateFormat .Site.Params.DateForm .Date }}</time></span>
 						</div>
 						<h1 class="entry-title"><a href="{{ .Permalink }}" rel="bookmark">{{ .Title | safeHTML  }}</a></h1>
					</header>
					<div class="entry-content">
						{{ .Content }}
					</div>
				</article><!-- #post-## -->

			</div>
		</div> <!-- /row post  -->
		<hr/>
        <div class="row">
			<div class="col-sm-8 col-sm-offset-2">

				<div id="share">
                    {{ if .Params.Share }}
                       {{ partial "share-links.html" . }}
                    {{ end }}
				</div>
			</div>
		</div> <!-- /row share -->
		<div class="row">
			<div class="col-sm-8 col-sm-offset-2 text-center">
				<p>Questions or thoughts? Reach out on <a href="https://www.linkedin.com/in/timmykokke/" rel="noopener">LinkedIn</a> or <a href="mailto:{{ .Site.Params.email }}">email me</a>.</p>
			</div>
		</div> <!-- /row contact -->
	</div>	<!-- /container -->

</main>

{{ partial "footer.html" . }}
