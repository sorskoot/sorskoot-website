<div>
    <div class="slides">
        {{ range $index, $area := hugo.Data.slides }}
        <div class="slide">
            {{ partial "embed-facade.html" (dict
                "src" (printf "https:%s" .iframe)
                "href" (printf "https:%s" .link)
                "label" "▶ Show slides"
                "provider" "SlideShare"
                "width" "298" "height" "243") }}
            <div style="margin-bottom:5px"> <strong>
                    <a href="{{ .link }}" title="{{ .title }}" target="_blank">
                        {{ .title }}</a> </strong>
                </strong> </div>
        </div>
        {{ end }}
    </div>
</div>
</div>
