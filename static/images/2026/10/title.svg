<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="Trustworthy AI: a risk pyramid with four tiers, prohibited, high-risk, transparency and minimal risk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2550"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/>
    <path d="M80 0V627M160 0V627M240 0V627M320 0V627M400 0V627M480 0V627M560 0V627M640 0V627M720 0V627M800 0V627M880 0V627M960 0V627M1040 0V627M1120 0V627"/>
  </g>

  <!-- left: title block -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="130" font-size="22" font-weight="600" letter-spacing="4" fill="#9fb3ff">AI GOVERNANCE</text>
    <rect x="60" y="148" width="96" height="6" rx="3" fill="url(#accent)"/>
    <text x="56" y="270" font-size="88" font-weight="800">Trustworthy</text>
    <text x="56" y="362" font-size="88" font-weight="800">AI</text>
    <text x="60" y="425" font-size="26" fill="#cbd5f5">What the EU AI Act means</text>
    <text x="60" y="458" font-size="26" fill="#cbd5f5">for software engineers</text>
    <text x="60" y="560" font-size="22" font-weight="600" fill="#7c9cff">timmykokke.com</text>
  </g>

  <!-- right: risk pyramid -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <polygon points="800,90 920,90 973.8,200 746.2,200" fill="#e5484d"/>
    <text x="860" y="156" font-size="21" font-weight="700" fill="#ffffff">Prohibited</text>

    <polygon points="742.3,208 977.7,208 1031.5,318 688.5,318" fill="#f5883b"/>
    <text x="860" y="274" font-size="23" font-weight="700" fill="#1a1205">High-risk</text>

    <polygon points="684.6,326 1035.4,326 1089.2,436 630.8,436" fill="#f2c230"/>
    <text x="860" y="392" font-size="23" font-weight="700" fill="#1a1205">Transparency</text>

    <polygon points="626.9,444 1093.1,444 1140,540 580,540" fill="#3fb27f"/>
    <text x="860" y="487" font-size="23" font-weight="700" fill="#06210f">Minimal risk</text>
    <text x="860" y="516" font-size="16" fill="#06210f">most of what we build</text>
  </g>
</svg>
